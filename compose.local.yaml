services:
  api:
    build:
      context: .
      target: api
    init: true
    restart: unless-stopped
    # Bootstrap/infrastructure only. Everything operators tune (AI providers and models, app
    # settings incl. time zone and upload limit, Steam Web API key, Stripe) is managed by admins
    # in the app and stored in Postgres; it survives rebuilds and restarts.
    environment:
      # local: development identities (WEB_TOKEN/DEVICE_TOKEN) are enabled; anything else = production.
      APP_ENV: ${APP_ENV:-local}
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://127.0.0.1:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3000}
      DATABASE_URL: postgres://cs2:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/cs2live
      OWNER_ID: ${OWNER_ID:-dev-owner}
      DEVICE_ID: ${DEVICE_ID:-dev-device}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      WEB_TOKEN: ${WEB_TOKEN:?Set WEB_TOKEN in .env}
      # Encrypts stored credentials (AES-256-GCM). Keep it stable once secrets are stored.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # SteamID64s promoted to admin when they sign in with Steam (comma-separated).
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS:-}
      OBJECT_STORAGE_DIR: /data/objects
      DEMO_PARSER_BIN: /usr/local/bin/demo-parser
      # Demos are parsed by the sandboxed `worker` service below, never inside the API.
      DEMO_WORKER: external
      # Public sample demo that new accounts can import (admins toggle it in Settings).
      SAMPLE_DEMO_FILE: /data/sample/public-cs2.dem
      # Optional extra trusted CA (EXTRA_CA_CERTS_FILE on the host; empty file by default).
      NODE_EXTRA_CA_CERTS: /etc/cs2/extra-ca.pem
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - objects:/data/objects
      - ${EXTRA_CA_CERTS_FILE:-./docker/no-extra-ca.pem}:/etc/cs2/extra-ca.pem:ro
      - ./apps/demo-parser/testdata:/data/sample:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 150s
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  # Sandboxed demo worker: parses untrusted uploads with a third-party library. Same image as
  # the API, different command. No internet (only the internal `parser` network shared with
  # Postgres), read-only root filesystem with a tmpfs /tmp, non-root, no capabilities, bounded
  # memory/CPU/processes; the parser itself runs under per-process rlimits
  # (docker/demo-parser-sandbox.sh). See docs/OPERATIONS.md "Demo worker sandbox".
  worker:
    build:
      context: .
      target: api
    command: ["node", "--import", "tsx", "src/worker.ts"]
    working_dir: /app/apps/api
    init: true
    restart: unless-stopped
    user: node
    environment:
      APP_ENV: ${APP_ENV:-local}
      # No development identities or tokens in the worker.
      ALLOW_DEV_AUTH: "false"
      DATABASE_URL: postgres://cs2:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/cs2live
      OBJECT_STORAGE_DIR: /data/objects
      DEMO_PARSER_BIN: /usr/local/bin/demo-parser-sandbox
    networks: [parser]
    volumes:
      # One flat directory: the worker reads demos and writes replay/events artifacts next to
      # them (and deletes them under retention), so the volume is mounted read-write.
      - objects:/data/objects
    read_only: true
    tmpfs:
      # Normalized parser output (≈1 MB per match, capped at 480 MiB) and the tsx cache.
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Measured: parser peak RSS ≈160 MB on a 218 MB demo; Go heap soft limit 1 GiB; Node ≈200 MB.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 64
    stop_grace_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const f=require('fs');process.exit(Date.now()-Number(f.readFileSync('/tmp/worker-heartbeat','utf8'))<60000?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
  # Real collector pipeline for local demos. Shares the API network namespace, so the
  # collector reaches the API on loopback and binds its GSI listener to 127.0.0.1 only.
  collector:
    build:
      context: .
      target: collector
    init: true
    restart: unless-stopped
    network_mode: "service:api"
    environment:
      API_URL: http://127.0.0.1:4000/v1/telemetry/gsi
      GSI_LISTEN: 127.0.0.1:3002
      DEVICE_ID: ${DEVICE_ID:-dev-device}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      GSI_AUTH_TOKEN: ${GSI_AUTH_TOKEN:?Set GSI_AUTH_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
  # Plays a scripted match into the collector on demand (Live page → "Simulate a match").
  simulator:
    build:
      context: .
      target: collector
    command: ["simulator"]
    init: true
    restart: unless-stopped
    network_mode: "service:api"
    environment:
      SIMULATOR_LISTEN: 0.0.0.0:3010
      GSI_AUTH_TOKEN: ${GSI_AUTH_TOKEN:?Set GSI_AUTH_TOKEN in .env}
    depends_on:
      - collector
    mem_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      # Effective only with APP_ENV=local (local session cookie and simulator controls).
      ENABLE_DEV_AUTH: "true"
      # Sign-in with Steam is required. Set DEV_AUTO_LOGIN=true only for automated tests:
      # it signs every visitor in as the local development owner.
      DEV_AUTO_LOGIN: ${DEV_AUTO_LOGIN:-false}
      # Server-side only: lets the local demo open a session via HttpOnly cookie.
      WEB_TOKEN: ${WEB_TOKEN:?Set WEB_TOKEN in .env}
      # Server-side only: authorizes the local match simulator control API.
      GSI_AUTH_TOKEN: ${GSI_AUTH_TOKEN:?Set GSI_AUTH_TOKEN in .env}
      SIMULATOR_URL: http://api:3010
      API_URL: http://api:4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  objects:
networks:
  # Internal: no route to the internet. Only Postgres and the demo worker are attached.
  parser:
    internal: true
