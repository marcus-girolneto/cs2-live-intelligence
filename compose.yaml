services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cs2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: cs2live
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2 -d cs2live"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
